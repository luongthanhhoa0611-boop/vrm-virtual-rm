[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Cho phep goi /tts (giong het server local vrm_server.py) thay vi phai goi
# duong dai /.netlify/functions/tts -> index.html dung CHUNG mot duong dan
# cho ca khi chay local lan khi deploy.
[[redirects]]
  from = "/tts"
  to = "/.netlify/functions/tts"
  status = 200
  force = true
